name:
  en-US: "Staff Stats"
  fr: "Stats staff"
description:
  en-US: "Weekly activity quotas for staff roles (messages + voice time)."
  fr: "Quotas d'activite hebdomadaires pour les roles de staff (messages + temps vocal)."
order: 70
pages:
  staff_stats:
    title:
      en-US: "stats-staff (group)"
      fr: "stats-staff (groupe)"
    description:
      en-US: |
        See your own weekly stats, or (if you hold the configured "Responsible Staff" role,
        or are an administrator) another staff member's, against their role's quota. Also
        explains how the OU (either side, combined proportionally) and ET (both sides, with a
        substitution penalty if one falls short) quota modes are calculated.
      fr: |
        Consulte tes propres stats de la semaine, ou (si tu as le role "Responsable Staff"
        configure, ou que tu es administrateur) celles d'un autre membre du staff, par rapport
        au quota de son role. Explique aussi comment sont calcules les modes de quota OU (l'un
        des deux, combine proportionnellement) et ET (les deux, avec une penalite de
        substitution en cas de manque).
    category:
      en-US: "Staff Stats"
      fr: "Stats staff"
    quick_tips:
      - en-US: "`/stats-staff me` only works if you hold a role with a configured quota."
        fr: "`/stats-staff moi` ne fonctionne que si tu as un role avec un quota configure."
      - en-US: "`/stats-staff view` is restricted to admins and the configured Responsible Staff role."
        fr: "`/stats-staff voir` est reserve aux admins et au role Responsable Staff configure."
      - en-US: "The ET substitution penalty is set by admins in `/stats-staff-admin config`."
        fr: "La penalite de substitution ET est reglee par les admins dans `/stats-staff-admin config`."
    examples:
      - en-US: "/stats-staff me period:Current week"
        fr: "/stats-staff moi periode:Semaine en cours"
      - en-US: "/stats-staff view member:@User"
        fr: "/stats-staff voir membre:@Utilisateur"
  staff_stats_admin:
    title:
      en-US: "stats-staff-admin (group)"
      fr: "stats-staff-admin (groupe)"
    description:
      en-US: |
        Admin command group to configure staff quota tracking: the responsible role, the
        tracked message/voice channels, whole tracked categories (every channel inside counts),
        per-role quotas, the ET substitution penalty, and the weekly report channel. Also lets
        you preview what the weekly report would currently look like without waiting for Monday.
      fr: |
        Groupe de commandes admin pour configurer le suivi des quotas staff : le role
        responsable, les salons de messages/vocal suivis, des categories entieres suivies (tous
        les salons a l'interieur comptent), les quotas par role, la penalite de substitution ET,
        et le salon de rapport hebdomadaire. Permet aussi de previsualiser le rapport
        hebdomadaire sans attendre lundi.
    category:
      en-US: "Staff Stats"
      fr: "Stats staff"
    quick_tips:
      - en-US: "Reserved to administrators by default; an admin can delegate it to the Responsible Staff role via the server's command permissions (Integrations settings)."
        fr: "Reserve aux administrateurs par defaut ; un admin peut deleguer l'acces au role Responsable Staff via les permissions de commande du serveur (parametres Integrations)."
      - en-US: "A member matching several configured quota roles must be assigned explicitly from the quota panel, otherwise their highest quota role is used."
        fr: "Un membre correspondant a plusieurs roles a quota configures doit etre assigne explicitement depuis le panneau des quotas, sinon son role quota le plus haut est utilise."
    examples:
      - en-US: "/stats-staff-admin config"
        fr: "/stats-staff-admin config"
      - en-US: "/stats-staff-admin preview-report"
        fr: "/stats-staff-admin apercu-rapport"
