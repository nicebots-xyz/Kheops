commands:
  announce:
    name:
      en-US: "announce"
      fr: "annonce"
    description:
      en-US: "Create and schedule announcements"
      fr: "Créer et programmer des annonces"
    commands:
      creer:
        name:
          en-US: "create"
          fr: "creer"
        description:
          en-US: "Create or schedule an announcement"
          fr: "Créer ou programmer une annonce"
      historique:
        name:
          en-US: "history"
          fr: "historique"
        description:
          en-US: "View, cancel or duplicate recent announcements"
          fr: "Voir, annuler ou dupliquer les annonces récentes"
  announce-admin:
    name:
      en-US: "announce-admin"
      fr: "annonce-admin"
    description:
      en-US: "Announce module administration"
      fr: "Administration du module annonce"
    commands:
      config:
        name:
          en-US: "config"
          fr: "config"
        description:
          en-US: "Configure who can schedule announcements besides admins"
          fr: "Configurer qui peut programmer des annonces en plus des admins"
strings:
  signature:
    en-US: "-# Announcement made by {author}"
    fr: "-# Annonce effectuée par {author}"
  no_permission:
    en-US: "You don't have a role allowed to schedule an announcement."
    fr: "Tu n'as pas de rôle autorisé à programmer une annonce."
  panel_title:
    en-US: "## Announcement builder"
    fr: "## Composition de l'annonce"
  channel_label:
    en-US: "Channel"
    fr: "Salon"
  no_channel:
    en-US: "*(no channel selected)*"
    fr: "*(aucun salon sélectionné)*"
  no_title:
    en-US: "*(no title yet)*"
    fr: "*(pas encore de titre)*"
  no_content:
    en-US: "*(no content yet)*"
    fr: "*(pas encore de contenu)*"
  schedule_label:
    en-US: "Sending"
    fr: "Envoi"
  schedule_not_set:
    en-US: "right away, once sent"
    fr: "tout de suite, une fois envoyée"
  schedule_required:
    en-US: "a date/time is required (only admins can send instantly)"
    fr: "une date/heure est requise (seuls les admins peuvent envoyer instantanément)"
  schedule_summary:
    en-US: "<t:{timestamp}:F> (<t:{timestamp}:R>)"
    fr: "<t:{timestamp}:F> (<t:{timestamp}:R>)"
  edit_content:
    en-US: "Edit content"
    fr: "Modifier le contenu"
  edit_schedule:
    en-US: "Edit schedule"
    fr: "Modifier la programmation"
  preview:
    en-US: "Preview"
    fr: "Aperçu"
  preview_label:
    en-US: "Preview — this is not sent yet:"
    fr: "Aperçu — ce n'est pas encore envoyé :"
  cancel:
    en-US: "Cancel"
    fr: "Annuler"
  cancelled:
    en-US: "Cancelled."
    fr: "Annulée."
  send_now_action:
    en-US: "Send now"
    fr: "Envoyer maintenant"
  schedule_action:
    en-US: "Schedule"
    fr: "Programmer"
  sent:
    en-US: "✅ Announcement sent."
    fr: "✅ Annonce envoyée."
  send_failed:
    en-US: "⚠️ The announcement could not be sent. Check that the bot can post in that channel."
    fr: "⚠️ L'annonce n'a pas pu être envoyée. Vérifie que le bot peut publier dans ce salon."
  scheduled:
    en-US: "📅 Announcement scheduled for <t:{timestamp}:F>."
    fr: "📅 Annonce programmée pour le <t:{timestamp}:F>."
  save_changes:
    en-US: "Save changes"
    fr: "Enregistrer les modifications"
  changes_saved:
    en-US: "✅ Changes saved, still scheduled for <t:{timestamp}:F>."
    fr: "✅ Modifications enregistrées, toujours programmée pour le <t:{timestamp}:F>."
  not_scheduled:
    en-US: "This announcement is no longer scheduled, it was already sent or cancelled."
    fr: "Cette annonce n'est plus programmée, elle a déjà été envoyée ou annulée."
  channel_placeholder:
    en-US: "Choose the channel to post in…"
    fr: "Choisir le salon où publier…"
  roles_placeholder:
    en-US: "Roles to mention (optional)…"
    fr: "Rôles à mentionner (optionnel)…"
  content_modal_title:
    en-US: "Announcement content"
    fr: "Contenu de l'annonce"
  announcement_title:
    en-US: "Title"
    fr: "Titre"
  announcement_content:
    en-US: "Content"
    fr: "Contenu"
  announcement_footer:
    en-US: "Footer"
    fr: "Pied de page"
  announcement_image:
    en-US: "Image"
    fr: "Image"
  announcement_image_description:
    en-US: "PNG, JPEG, GIF or WebP up to 10 MiB. Replaces the current image, if any."
    fr: "PNG, JPEG, GIF ou WebP jusqu'à 10 Mio. Remplace l'image actuelle, s'il y en a une."
  invalid_image:
    en-US: "The image must be a PNG, JPEG, GIF or WebP file."
    fr: "L'image doit être un fichier PNG, JPEG, GIF ou WebP."
  image_too_large:
    en-US: "The image is too large, the limit is {max_size} MiB."
    fr: "L'image est trop lourde, la limite est de {max_size} Mio."
  text_too_long:
    en-US: "The announcement is {length} characters long once rendered, Discord allows at most {max_length}. Shorten the title, content or footer, or mention fewer roles."
    fr: "L'annonce fait {length} caractères une fois mise en forme, Discord en autorise au plus {max_length}. Raccourcis le titre, le contenu ou le pied de page, ou mentionne moins de rôles."
  schedule_modal_title:
    en-US: "Schedule"
    fr: "Programmation"
  schedule_date:
    en-US: "Date"
    fr: "Date"
  schedule_date_placeholder:
    en-US: "24/12/2026"
    fr: "24/12/2026"
  schedule_date_description:
    en-US: "\"DD/MM/YYYY\", timezone {timezone}."
    fr: "\"JJ/MM/AAAA\", fuseau {timezone}."
  schedule_time:
    en-US: "Time (24h)"
    fr: "Heure (24h)"
  schedule_time_placeholder:
    en-US: "18:30"
    fr: "18:30"
  schedule_send_now_hint:
    en-US: "Leave both fields empty to send right away."
    fr: "Laisse les deux champs vides pour envoyer tout de suite."
  invalid_date:
    en-US: "The date must look like \"DD/MM/YYYY\", for example \"24/12/2026\"."
    fr: "Le format attendu est \"JJ/MM/AAAA\", par exemple \"24/12/2026\"."
  invalid_time:
    en-US: "The time must look like \"HH:MM\" (24h), for example \"18:30\"."
    fr: "Le format attendu est \"HH:MM\" (24h), par exemple \"18:30\"."
  schedule_in_past:
    en-US: "That date/time is already past."
    fr: "Cette date/heure est déjà passée."
  no_announcements:
    en-US: "No announcements yet."
    fr: "Aucune annonce pour l'instant."
  status_scheduled:
    en-US: "📅 Scheduled"
    fr: "📅 Programmée"
  status_sending:
    en-US: "📤 Sending"
    fr: "📤 Envoi en cours"
  status_sent:
    en-US: "✅ Sent"
    fr: "✅ Envoyée"
  status_cancelled:
    en-US: "🚫 Cancelled"
    fr: "🚫 Annulée"
  status_failed:
    en-US: "⚠️ Failed"
    fr: "⚠️ Échec"
  history_line:
    en-US: "**{title}** — {status} — {channel} — <t:{timestamp}:f>"
    fr: "**{title}** — {status} — {channel} — <t:{timestamp}:f>"
  duplicate:
    en-US: "Duplicate"
    fr: "Dupliquer"
  edit:
    en-US: "Edit"
    fr: "Modifier"
  cancel_scheduled:
    en-US: "Cancel"
    fr: "Annuler"
  config_summary:
    en-US: "## Announce configuration\n- Roles allowed to schedule (besides admins): {allowed_roles}"
    fr: "## Configuration du module annonce\n- Rôles autorisés à programmer (en plus des admins) : {allowed_roles}"
  none:
    en-US: "none"
    fr: "aucun"
  placeholder_allowed_role_ids:
    en-US: "Change the roles allowed to schedule…"
    fr: "Changer les rôles autorisés à programmer…"
